spring.application.name=app-location
server.port=8081
spring.main.allow-circular-references=true
spring.datasource.url=jdbc:postgresql://localhost:5432/DBCOFFEWORK
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


integration.overpass.base-url=https://overpass-api.de
integration.overpass.connect-timeout=5s
integration.overpass.read-timeout=30s
integration.overpass.cache-ttl=7d
