name: CI - Persist Coverage

on:
  push:

permissions:
  contents: write
  actions: write
  pull-requests: write
jobs:
  build-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with JaCoCo
        run: mvn clean verify -B

      - name: Testar Permissão do Token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Extract and Update Repository Variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Localiza o arquivo CSV (o caminho pode variar conforme o projeto)
          REPORT_PATH="target/site/jacoco/jacoco.csv"

          if [ -f "$REPORT_PATH" ]; then
            # 2. Extrai a cobertura usando AWK (calcula % de instruções cobertas)
            # Coluna 4: INSTRUCTION_MISSED | Coluna 5: INSTRUCTION_COVERED
            COVERAGE=$(awk -F, 'NR > 1 { missed += $4; covered += $5 } END { if (covered + missed > 0) print int((covered / (covered + missed)) * 100); else print 0 }' $REPORT_PATH)

            echo "Cobertura calculada: $COVERAGE%"

            # 3. Salva ou Atualiza a variável no repositório
            # O nome da variável será 'ULTIMA_COBERTURA_PROJETO'
            echo "ULTIMA_COBERTURA_PROJETO=${COVERAGE}" >> $GITHUB_ENV

            echo "Variável ULTIMA_COBERTURA_PROJETO atualizada com sucesso!"
          else
            echo "Erro: Arquivo jacoco.csv não encontrado em $REPORT_PATH"
            exit 1
          fi

      - name: Verificar Atualização
        run: |
          echo "Agora a variável contém: ${{ vars.ULTIMA_COBERTURA_PROJETO }}"