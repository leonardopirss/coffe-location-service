name: CI - Persist Coverage

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    # Permissões explícitas no nível do Job
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with JaCoCo
        run: mvn clean verify -B

      - name: Extract and Update Repository Variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_PATH="target/site/jacoco/jacoco.csv"

          if [ -f "$REPORT_PATH" ]; then
            # Extrai o valor do CSV
            COVERAGE=$(awk -F, 'NR > 1 { missed += $4; covered += $5 } END { if (covered + missed > 0) print int((covered / (covered + missed)) * 100); else print 0 }' $REPORT_PATH)
          
            echo "Cobertura calculada: $COVERAGE%"

            # Persiste o valor na Variable do Repositório
            # O 'gh' vai criar a variável se ela não existir ou atualizar se já existir
            gh variable set ULTIMA_COBERTURA_PROJETO --body "${COVERAGE}%"
          
            echo "Variável atualizada com sucesso no GitHub!"
          else
            echo "Erro: Arquivo jacoco.csv não encontrado."
            exit 1
          fi

      - name: Debug Novo Valor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Valor lido via API após atualização:"
          gh variable get ULTIMA_COBERTURA_PROJETO