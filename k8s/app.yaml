apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-location-service
  namespace: app-location
  labels:
    app: app-location-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-location-service
  template:
    metadata:
      labels:
        app: app-location-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: app-location-service
          image: app-location-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://app-location-db:5432/DBCOFFEWORK
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-location-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app-location-service
  namespace: app-location
  labels:
    app: app-location-service
spec:
  type: NodePort
  selector:
    app: app-location-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
