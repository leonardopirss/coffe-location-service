apiVersion: v1
kind: Secret
metadata:
  name: app-location-db-secret
  namespace: app-location
type: Opaque
stringData:
  POSTGRES_PASSWORD: "123456"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-location-db-data
  namespace: app-location
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-location-db
  namespace: app-location
  labels:
    app: app-location-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-location-db
  template:
    metadata:
      labels:
        app: app-location-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: DBCOFFEWORK
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-location-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - DBCOFFEWORK
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-location-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: app-location-db
  namespace: app-location
  labels:
    app: app-location-db
spec:
  selector:
    app: app-location-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
